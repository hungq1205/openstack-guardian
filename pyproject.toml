[project]
name = "cmp-mcp"
version = "0.1.0"
description = "MCP servers for the CMP admin API and Elasticsearch logs -- a Claude Code MCP plugin, paired with the cmp-incident-response skill under .claude/skills/."
requires-python = ">=3.12"
dependencies = [
    # Pinned below 2.0: that release changed the Server API this code is
    # written against (list_tools()/call_tool() decorators,
    # mcp.shared.memory.create_connected_server_and_client_session) in
    # breaking ways. 1.28.1 is the exact version this code was built and
    # tested against.
    "mcp>=1.28.1,<2.0.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
    # Guardian's shared config/ticketing/telemetry/masking store -- not
    # cmp-mcp's own code, see guardian-platform/src/guardian_platform/__init__.py.
    "guardian-platform",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.uv.sources]
guardian-platform = { path = "../guardian-platform", editable = true }

[tool.uv]
# guardian-platform's admin_gui depends back on this project for 2 narrow
# CMP-specific features (native tool-probing, spec-source CRUD) -- only an
# installable package can be an editable path dependency for that. This
# doesn't make cmp-mcp's own MCP servers a reusable library in general; it's
# specifically for that one consumer.
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_servers"]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.ruff]
# Matches the convention this code was originally written under (opensre's
# ruff.toml) so extracting it here doesn't trigger a pile of unrelated
# reflow diffs.
line-length = 100
