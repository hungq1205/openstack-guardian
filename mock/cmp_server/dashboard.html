<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mock CMP server</title>
<style>
  :root {
    --bg: #0f1216;
    --card: #171b21;
    --border: #2a3038;
    --text: #e6e9ee;
    --text-dim: #9aa4b2;
    --red: #f2545b;
    --red-bg: rgba(242, 84, 91, 0.12);
    --green: #3ecf8e;
    --green-bg: rgba(62, 207, 142, 0.12);
    --accent: #5b8def;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { max-width: 960px; margin: 0 auto 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  header p { color: var(--text-dim); margin: 0; font-size: 13px; }
  main { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .card-head h2 { font-size: 16px; margin: 0; }
  .kb-id { color: var(--text-dim); font-size: 12px; font-family: ui-monospace, monospace; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    white-space: nowrap;
  }
  .pill.failing { background: var(--red-bg); color: var(--red); }
  .pill.healthy { background: var(--green-bg); color: var(--green); }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .cause { color: var(--text-dim); margin: 10px 0 0; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--accent); font-size: 12px; user-select: none; }
  .instruction {
    margin: 8px 0 0; padding: 10px 12px; background: #10151c; border: 1px solid var(--border);
    border-radius: 6px; color: var(--text-dim); font-size: 12.5px; white-space: pre-wrap;
  }
  .log-line {
    margin: 12px 0 0; padding: 10px 12px; background: #10151c; border: 1px solid var(--border);
    border-radius: 6px; font-family: ui-monospace, monospace; font-size: 12px; color: #d99a3f;
    white-space: pre-wrap; word-break: break-word;
  }
  .log-line.empty { color: var(--text-dim); font-family: inherit; }
  .curl { margin-top: 8px; font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--text-dim); }
  .curl div { margin-top: 2px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button {
    border: 1px solid var(--border); background: #1d232b; color: var(--text);
    padding: 7px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--red); border-color: var(--red); color: #fff; }
  button.primary:hover { filter: brightness(1.08); }
  button.resolve { background: var(--green); border-color: var(--green); color: #08231a; }
  button:disabled { opacity: 0.45; cursor: default; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1d232b; border: 1px solid var(--border); color: var(--text);
    padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .doc-id { color: var(--text-dim); font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>Mock CMP server</h1>
  <p>Click "Simulate failure" to produce a real error log + a broken server, exactly as documented
     in a failure-pattern KB entry. Fix it with "Resolve now" here, or by running the real
     investigate-incident flow against it (same CMP <code>recreate</code> call either way).</p>
</header>
<main id="cards"></main>
<div class="toast" id="toast"></div>
<script>
const cardsEl = document.getElementById('cards');
const toastEl = document.getElementById('toast');
let toastTimer = null;

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function curlLines(state) {
  const origin = window.location.origin;
  const lines = [`curl ${origin}/admin-api/servers/${state.server_id}/`];
  if (state.dependent) {
    const path = state.dependent.kind === 'volume'
      ? `/admin-api/volumes/${state.dependent.id}/`
      : `/admin-v2/network/elastic-ips/${state.dependent.id}/`;
    lines.push(`curl ${origin}${path}`);
  }
  lines.push(`curl -X POST ${origin}/admin-api/servers/${state.server_id}/recreate/`);
  return lines;
}

function renderCard(state) {
  const failing = !state.resolved;
  const div = document.createElement('div');
  div.className = 'card';
  const logLine = state.last_log_line
    ? `<div class="log-line">${state.last_log_line.replace(/</g, '&lt;')}</div>` +
      `<div class="doc-id">${state.last_doc_id
        ? `indexed into Elasticsearch as ${state.last_doc_id}`
        : 'not indexed into Elasticsearch -- it was unreachable, but the CMP-side failure above is still real'}</div>`
    : `<div class="log-line empty">Not simulated yet -- click "Simulate failure" to produce the log line and break the server.</div>`;
  div.innerHTML = `
    <div class="card-head">
      <div>
        <h2>${state.title}</h2>
        <span class="kb-id">KB: ${state.kb_id}</span>
      </div>
      <span class="pill ${failing ? 'failing' : 'healthy'}">${failing ? 'Failing' : 'Healthy'}</span>
    </div>
    <p class="cause">${state.cause}</p>
    <details>
      <summary>Remediation (from the KB)</summary>
      <div class="instruction">${state.instruction}</div>
    </details>
    ${logLine}
    <div class="curl">${curlLines(state).map(l => `<div>$ ${l}</div>`).join('')}</div>
    <div class="actions">
      <button class="primary" data-action="simulate" data-id="${state.id}">Simulate failure</button>
      <button class="resolve" data-action="resolve" data-id="${state.id}" ${!failing ? 'disabled' : ''}>
        Resolve now (recreate)
      </button>
    </div>
  `;
  return div;
}

async function refresh() {
  const res = await fetch('/_mock/scenarios');
  const body = await res.json();
  cardsEl.innerHTML = '';
  for (const state of body.scenarios) cardsEl.appendChild(renderCard(state));
}

cardsEl.addEventListener('click', async (event) => {
  const button = event.target.closest('button[data-action]');
  if (!button) return;
  button.disabled = true;
  try {
    const res = await fetch(`/_mock/scenarios/${button.dataset.id}/${button.dataset.action}`, { method: 'POST' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    showToast(button.dataset.action === 'simulate' ? 'Failure simulated' : 'Resolved');
  } catch (err) {
    showToast(`Failed: ${err.message}`);
  } finally {
    await refresh();
  }
});

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
